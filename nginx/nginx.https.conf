worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    
    # По умолчанию nginx резолвит имя `app` один раз на старте,
    # и после пересоздания контейнера начинает ходить в старый IP (502 / no route).
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name deletebadzim.aurorass.art;

        # ACME challenge для Let's Encrypt (certbot --webroot) - чек на владение доменом
        location ^~ /.well-known/acme-challenge/ { 
            root /var/www/certbot;
            default_type text/plain; 
        }

        # Редирект клиентов на HTTPS 
        location / {
            return 301 https://$host$request_uri;  
        }
    }

    server {
        listen 443 ssl;
        server_name deletebadzim.aurorass.art;

        ssl_certificate /etc/letsencrypt/live/deletebadzim.aurorass.art/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deletebadzim.aurorass.art/privkey.pem;

        client_max_body_size 10m;

        location / {
            set $upstream_app http://app:8080;
            proxy_pass $upstream_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 1500s;
            proxy_read_timeout 1500s;
        }
    }
}
