services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata_jobotparse:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8080:8080" 
    volumes:
      - ./tokens.json:/app/tokens.json
      - ./.env:/app/.env
      - ./vacancies.html:/app/vacancies.html
  # nginx:
  #   build: ./nginx
  #   depends_on:
  #     - app
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/static:/usr/share/nginx/html/static:ro

volumes:
  pgdata_jobotparse:
  
