<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — JobotParse</title>
  <style>
    body{background:#000;color:#fff;font-family:Inter,Arial,sans-serif;margin:0;padding:0;display:flex;align-items:center;justify-content:center;height:100vh;}
    .card{background:#111;padding:24px;border-radius:8px;width:320px;box-shadow:0 6px 18px rgba(0,0,0,.6);}
    label{display:block;font-size:13px;margin-top:8px;color:#ddd}
    input[type="text"],input[type="password"]{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #333;background:#000;color:#fff}
    button{margin-top:12px;width:100%;padding:10px;border-radius:6px;border:0;background:#0b84ff;color:#fff;font-weight:600;cursor:pointer}
    .hint{font-size:12px;color:#999;margin-top:8px}
  </style>
</head>
<body>
  <form class="card" method="POST" action="/auth">
    <h3 style="margin:0 0 8px 0;color:#fff">Admin login</h3>
    <label>Username
      <input name="username" type="text" autocomplete="username" required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Authorize</button>
    <div class="hint">Введите учётные из .env (ADMIN_USER / ADMIN_PASS)</div>
  </form>
</body>
</html>
