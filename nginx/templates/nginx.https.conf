worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS. По умолчанию nginx резолвит имя `app` один раз на старте,
    # и после пересоздания контейнера начинает ходить в старый IP (502 / no route).
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name deletebadzim.aurorass.art;

        # ACME HTTP-01 (на всякий случай оставляем)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name deletebadzim.aurorass.art;

        ssl_certificate /etc/letsencrypt/live/deletebadzim.aurorass.art/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deletebadzim.aurorass.art/privkey.pem;

        # Разрешаем загрузку PDF (у тебя лимит в Go 10MB; тут чуть выше)
        client_max_body_size 12m;

        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        location / {
            set $upstream_app http://app:8080;
            proxy_pass $upstream_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
