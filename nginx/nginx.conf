worker_processes 1;
events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;


    server {
        listen 443 ssl;
        server_name deletebadzim.aurorass.art;

        ssl_certificate /etc/letsencrypt/live/deletebadzim.aurorass.art/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deletebadzim.aurorass.art/privkey.pem;

        # Using default TLS settings for now (keep config simple).
        # If you later want stronger defaults, we can add ssl_protocols and headers.

        # Отдаём статические файлы
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        # Все остальные запросы проксируем на backend (app)
        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name deletebadzim.aurorass.art;
        return 301 https://$host$request_uri;
    }
}